- op: replace
  path: /metadata/name
  value: build-image-index-min
# kustomize build task/build-image-index/ | yq '.spec.steps.[].name' | nl -v 0
#  0	build
#  1	create-and-push-sbom


# build step
- op: test
  path: /spec/steps/0/name
  value: build
- op: replace
  path: /spec/steps/0/computeResources/limits/memory
  value: 256Mi
- op: replace
  path: /spec/steps/0/computeResources/requests/memory
  value: 256Mi
- op: replace
  path: /spec/steps/0/computeResources/requests/cpu
  value: 100m

# create-and-push-sbom step
- op: test
  path: /spec/steps/1/name
  value: create-and-push-sbom
- op: replace
  path: /spec/steps/1/computeResources/limits/memory
  value: 256Mi
- op: replace
  path: /spec/steps/1/computeResources/requests/memory
  value: 256Mi
- op: replace
  path: /spec/steps/1/computeResources/requests/cpu
  value: 100m
