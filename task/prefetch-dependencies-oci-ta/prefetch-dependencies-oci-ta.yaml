---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prefetch-dependencies-oci-ta
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: image-build, konflux
  labels:
    app.kubernetes.io/version: 0.11.0
spec:
  description: Task that prefetches project dependencies for hermetic build.
  params:
    - name: ACTIVATION_KEY
      description: Name of secret which contains subscription activation key
      type: string
      default: activation-key
    - name: SERVICE_CA_TRUST_CONFIG_MAP_KEY
      description: The name of the key in the ConfigMap that contains the
        service CA bundle data. Used to verify TLS connections to in-cluster
        services such as the package registry proxy.
      type: string
      default: service-ca.crt
    - name: SERVICE_CA_TRUST_CONFIG_MAP_NAME
      description: The name of the ConfigMap to read service CA bundle data
        from. Used to verify TLS connections to in-cluster services such as
        the package registry proxy.
      type: string
      default: openshift-service-ca.crt
    - name: SOURCE_ARTIFACT
      description: The Trusted Artifact URI pointing to the artifact with
        the application source code.
      type: string
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the
        CA bundle data.
      type: string
      default: ca-bundle.crt
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca
    - name: config-file-content
      description: |
        Pass configuration to the prefetch tool.
        Note this needs to be passed as a YAML-formatted config dump, not as a file path!
      default: ""
    - name: enable-package-registry-proxy
      description: Use the package registry proxy when prefetching dependencies
      type: string
      default: "true"
    - name: input
      description: Configures project packages that will have their dependencies
        prefetched.
    - name: log-level
      description: Set the logging level (debug, info, warn, error, fatal).
      default: debug
    - name: mode
      description: 'Control how input requirement violations are handled:
        strict (errors) or permissive (warnings).'
      type: string
      default: strict
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifacts created in the
        OCI repository. An empty string means the artifacts do not expire.
      type: string
      default: ""
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
    - name: pip-index-url
      description: Python package index URL to use when prefetching pip dependencies.
        Used as a fallback when requirements.txt does not specify --index-url.
        When empty (default), the standard PyPI index is used.
      type: string
      default: ""
    - name: sbom-type
      description: 'Select the SBOM format to generate. Valid values: spdx,
        cyclonedx.'
      default: spdx
  results:
    - name: PREFETCH_ARTIFACT
      description: The Trusted Artifact URI pointing to the artifact with
        the prefetched dependencies.
      type: string
    - name: SOURCE_ARTIFACT
      description: The Trusted Artifact URI pointing to the artifact with
        the application source code.
      type: string
  volumes:
    - name: activation-key
      secret:
        optional: true
        secretName: $(params.ACTIVATION_KEY)
    - name: config
      emptyDir: {}
    - name: service-ca
      configMap:
        items:
          - key: $(params.SERVICE_CA_TRUST_CONFIG_MAP_KEY)
            path: ca-bundle.crt
        name: $(params.SERVICE_CA_TRUST_CONFIG_MAP_NAME)
        optional: true
    - name: trusted-ca
      configMap:
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        name: $(params.caTrustConfigMapName)
        optional: true
    - name: workdir
      emptyDir: {}
  workspaces:
    - name: git-basic-auth
      description: |
        A Workspace containing a .gitconfig and .git-credentials file or username and password.
        These will be copied to the user's home before prefetch is run. Any
        other files in this Workspace are ignored. It is strongly recommended
        to bind a Secret to this Workspace over other volume types.
      optional: true
    - name: netrc
      description: |
        Workspace containing a .netrc file. Prefetch will use the credentials in this file when
        performing http(s) requests.
      optional: true
  stepTemplate:
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
  steps:
    - name: skip-ta
      image: quay.io/konflux-ci/task-runner:2.0.0@sha256:4b01fbf98fa7155f5c21443c285f88853864ae7cc66981cf6b543fc6ba16b81b
      env:
        - name: SOURCE_ARTIFACT
          value: $(params.SOURCE_ARTIFACT)
      script: |
        #!/bin/bash

        echo -n "${SOURCE_ARTIFACT}" >"$(results.SOURCE_ARTIFACT.path)"
        echo -n "" >"$(results.PREFETCH_ARTIFACT.path)"
      computeResources:
        limits:
          memory: 64Mi
        requests:
          cpu: 50m
          memory: 64Mi
      when:
        - input: $(params.input)
          operator: in
          values:
            - ""
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:7b4f5bbf8b8aa663beaf18bfef4fd16ba1cb5ce846d1fc776a64b312c52ee28c
      args:
        - use
        - $(params.SOURCE_ARTIFACT)=/var/workdir/source
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      when:
        - input: $(params.input)
          operator: notin
          values:
            - ""
    - name: prefetch-dependencies
      image: quay.io/konflux-ci/hermeto:0.63.0@sha256:cad54694e0b9ebcbb65eac5f3943154518ab60876a5df41317b5f399df484006
      volumeMounts:
        - mountPath: /activation-key
          name: activation-key
        - mountPath: /mnt/config
          name: config
        - mountPath: /mnt/trusted-ca
          name: trusted-ca
          readOnly: true
        - mountPath: /mnt/service-ca
          name: service-ca
          readOnly: true
      env:
        - name: KBC_LOG_LEVEL
          value: $(params.log-level)
        - name: KBC_PD_INPUT
          value: $(params.input)
        - name: KBC_PD_SOURCE_DIR
          value: /var/workdir/source
        - name: KBC_PD_OUTPUT_DIR
          value: /var/workdir/prefetch/output
        - name: KBC_PD_SBOM_FORMAT
          value: $(params.sbom-type)
        - name: KBC_PD_MODE
          value: $(params.mode)
        - name: KBC_PD_OUTPUT_DIR_MOUNT_POINT
          value: /cachi2/output
        - name: KBC_PD_ENV_FILES
          value: /var/workdir/prefetch/cachi2.env /var/workdir/prefetch/prefetch.env
            /var/workdir/prefetch/prefetch-env.json
        - name: KBC_PD_GIT_AUTH_DIRECTORY
          value: $(workspaces.git-basic-auth.path)
        - name: WORKSPACE_NETRC_PATH
          value: $(workspaces.netrc.path)
        - name: CONFIG_FILE_CONTENT
          value: $(params.config-file-content)
        - name: KBC_PD_ENABLE_PACKAGE_REGISTRY_PROXY
          value: $(params.enable-package-registry-proxy)
        - name: PIP_INDEX_URL
          value: $(params.pip-index-url)
      script: |
        #!/bin/bash

        if [ -n "${WORKSPACE_NETRC_PATH}" ]; then
          export NETRC="${WORKSPACE_NETRC_PATH}/.netrc"
        fi

        CA_BUNDLE_PATH=/mnt/trusted-ca/ca-bundle.crt
        SERVICE_CA_BUNDLE_PATH=/mnt/service-ca/ca-bundle.crt
        UPDATE_CA_TRUST=false

        if [ -f "$CA_BUNDLE_PATH" ]; then
          echo "Using mounted CA bundle: $CA_BUNDLE_PATH"
          cp -vf "$CA_BUNDLE_PATH" /etc/pki/ca-trust/source/anchors/ca-bundle.crt
          UPDATE_CA_TRUST=true
        fi

        if [ -f "$SERVICE_CA_BUNDLE_PATH" ]; then
          echo "Using mounted service CA bundle: $SERVICE_CA_BUNDLE_PATH"
          cp -vf "$SERVICE_CA_BUNDLE_PATH" /etc/pki/ca-trust/source/anchors/service-ca.crt
          UPDATE_CA_TRUST=true
        fi

        if [ "$UPDATE_CA_TRUST" = "true" ]; then
          update-ca-trust
          # requests ignores the system CA store. Set REQUESTS_CA_BUNDLE explicitly.
          export REQUESTS_CA_BUNDLE=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
        fi

        if [ -e /activation-key/org ] && [ -e /activation-key/activationkey ]; then
          export KBC_PD_RHSM_ORG=/activation-key/org
          export KBC_PD_RHSM_ACTIVATION_KEY=/activation-key/activationkey
        fi

        if [ -n "${CONFIG_FILE_CONTENT}" ]; then
          echo "${CONFIG_FILE_CONTENT}" >/mnt/config/config.yaml
          export KBC_PD_CONFIG_FILE=/mnt/config/config.yaml
        fi

        if [ -z "${PIP_INDEX_URL}" ]; then
          unset PIP_INDEX_URL
        fi

        konflux-build-cli prefetch-dependencies
      computeResources:
        limits:
          cpu: "1"
          memory: 3Gi
        requests:
          cpu: "1"
          memory: 3Gi
      when:
        - input: $(params.input)
          operator: notin
          values:
            - ""
    - name: create-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:7b4f5bbf8b8aa663beaf18bfef4fd16ba1cb5ce846d1fc776a64b312c52ee28c
      args:
        - create
        - --store
        - $(params.ociStorage)
        - $(results.SOURCE_ARTIFACT.path)=/var/workdir/source
        - $(results.PREFETCH_ARTIFACT.path)=/var/workdir/prefetch
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      env:
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.ociArtifactExpiresAfter)
      computeResources:
        limits:
          memory: 3Gi
        requests:
          cpu: "1"
          memory: 3Gi
      when:
        - input: $(params.input)
          operator: notin
          values:
            - ""
