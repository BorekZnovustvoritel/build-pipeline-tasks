---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: konflux-e2e-tests
spec:
  description: |-
    This pipeline automates the process of running end-to-end tests for container-build-catalog repository
    using a Kind cluster running on AWS. The pipeline provisions the Kind cluster,
    installs Konflux, runs the tests, collects artifacts, and deprovisions the cluster.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: ''
    - name: konflux-test-infra-secret
      description: The name of secret where testing infrastructures credentials are stored.
      type: string
      default: 'konflux-test-infra'
    - name: oci-container-repo
      default: 'quay.io/konflux-test-storage/konflux-team/container-build-catalog'
      description: The OCI container used to store all test artifacts.
    - name: artifact-browser-url
      description: "URL to the artifact browser deployment. If provided, a link will be added to PR comments."
      default: ""
      type: string
  tasks:
    - name: prepare-e2e
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/container-build-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: e2e-tests/tasks/prepare-e2e.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
    - name: create-test-pipeline-bundle
      runAfter:
        - prepare-e2e
      when:
        - input: "$(tasks.prepare-e2e.results.test-event-type)"
          operator: in
          values: ["pull_request"]
        - input: "$(tasks.prepare-e2e.results.run-e2e)"
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/container-build-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: e2e-tests/tasks/create-test-pipeline-bundle.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: snapshot-type
          value:  $(tasks.prepare-e2e.results.snapshot-type)
        - name: component-names
          value: $(tasks.prepare-e2e.results.component-names)
        - name: git-url
          value: $(tasks.prepare-e2e.results.git-url)
        - name: git-revision
          value: $(tasks.prepare-e2e.results.git-revision)
    - name: provision-kind-cluster
      runAfter:
        - prepare-e2e
      when:
        - input: "$(tasks.prepare-e2e.results.test-event-type)"
          operator: in
          values: ["pull_request"]
        - input: "$(tasks.prepare-e2e.results.run-e2e)"
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/mapt-oci/kind-aws-spot/provision/0.2/kind-aws-provision.yaml
      params:
        - name: secret-aws-credentials
          value: mapt-kind-secret
        - name: cluster-access-secret-name
          value: kfg-$(context.pipelineRun.name)
        - name: id
          value: $(context.pipelineRun.name)
        - name: tags
          value: 'owner=konflux-devprod@redhat.com,project=Konflux,created-by=integration-pipeline,component=container-build-catalog'
        - name: debug
          value: 'false'
        - name: ownerKind
          value: PipelineRun
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: oci-ref
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: credentials-secret-name
          value: $(params.konflux-test-infra-secret)
        - name: extra-port-mappings
          value: >-
            '[{\"containerPort\":30012,\"hostPort\":8180,\"protocol\":\"TCP\"}]'
        - name: cpus
          value: 64
        - name: memory
          value: 128
        - name: spot
          value: 'false'
        - name: harden-control-plane
          value: 'true'
    - name: deploy-konflux
      runAfter:
        - provision-kind-cluster
      when:
        - input: "$(tasks.prepare-e2e.results.test-event-type)"
          operator: in
          values: ["pull_request"]
        - input: "$(tasks.prepare-e2e.results.run-e2e)"
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/konflux-ci
          - name: revision
            value: main
          - name: pathInRepo
            value: .tekton/tasks/deploy-konflux/task.yaml
      params:
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: konflux-ready-timeout
          value: "30m"
        - name: oci-container-repo
          value: $(params.oci-container-repo)
        - name: oci-container-repo-credentials-secret
          value: $(params.konflux-test-infra-secret)
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
    - name: container-build-catalog-e2e-tests
      timeout: 2h
      runAfter:
        - deploy-konflux
        - create-test-pipeline-bundle
      when:
        - input: "$(tasks.prepare-e2e.results.test-event-type)"
          operator: in
          values: ["pull_request"]
        - input: "$(tasks.prepare-e2e.results.run-e2e)"
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/container-build-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: e2e-tests/tasks/container-build-catalog-e2e.yaml
      params:
        - name: git-url
          value: "https://github.com/konflux-ci/container-build-catalog.git"
        - name: git-revision
          value: main
        - name: oci-container
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: cluster-access-secret-name
          value: kfg-$(context.pipelineRun.name)
        - name: test-environment
          value: "upstream"
        - name: scenario-group
          value: $(tasks.prepare-e2e.results.scenario-group)
        - name: docker-build-pipeline-bundle
          value: $(tasks.create-test-pipeline-bundle.results.docker-build-pipeline-bundle)
        - name: docker-build-oci-ta-pipeline-bundle
          value: $(tasks.create-test-pipeline-bundle.results.docker-build-oci-ta-pipeline-bundle)
        - name: docker-build-oci-ta-min-pipeline-bundle
          value: $(tasks.create-test-pipeline-bundle.results.docker-build-oci-ta-min-pipeline-bundle)
        - name: docker-build-multi-platform-oci-ta-pipeline-bundle
          value: $(tasks.create-test-pipeline-bundle.results.docker-build-multi-platform-oci-ta-pipeline-bundle)
        - name: fbc-builder-pipeline-bundle
          value: $(tasks.create-test-pipeline-bundle.results.fbc-builder-pipeline-bundle)
  finally:
    - name: store-pipeline-status
      when:
        - input: "$(tasks.prepare-e2e.results.test-event-type)"
          operator: in
          values: ["pull_request"]
        - input: "$(tasks.prepare-e2e.results.run-e2e)"
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/store-pipeline-status/0.1/store-pipeline-status.yaml
      params:
        - name: oci-ref
          value: "$(params.oci-container-repo):$(context.pipelineRun.name)"
        - name: credentials-secret-name
          value: "$(params.konflux-test-infra-secret)"
        - name: pipelinerun-name
          value: $(context.pipelineRun.name)
        - name: pipeline-aggregate-status
          value: $(tasks.status)
    - name: deprovision-kind-cluster
      when:
        - input: "$(tasks.prepare-e2e.results.test-event-type)"
          operator: in
          values: ["pull_request"]
        - input: "$(tasks.prepare-e2e.results.run-e2e)"
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/mapt-oci/kind-aws-spot/deprovision/0.1/kind-aws-deprovision.yaml
      params:
        - name: secret-aws-credentials
          value: mapt-kind-secret
        - name: id
          value: $(context.pipelineRun.name)
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: oci-container
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: oci-credentials
          value: konflux-test-infra
    - name: pull-request-status-message
      when:
        - input: "$(tasks.prepare-e2e.results.test-event-type)"
          operator: in
          values: ["pull_request"]
        - input: "$(tasks.prepare-e2e.results.run-e2e)"
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/pull-request-comment/0.1/pull-request-comment.yaml
      params:
        - name: test-name
          value: $(context.pipelineRun.name)
        - name: oci-container
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: pipeline-aggregate-status
          value: $(tasks.status)
        - name: pull-request-author
          value: "$(tasks.prepare-e2e.results.pull-request-author)"
        - name: pull-request-number
          value: "$(tasks.prepare-e2e.results.pull-request-number)"
        - name: git-repo
          value: "$(tasks.prepare-e2e.results.git-repo)"
        - name: git-org
          value: "$(tasks.prepare-e2e.results.git-org)"
        - name: git-revision
          value: "$(tasks.prepare-e2e.results.git-revision)"
        - name: junit-report-name
          value: e2e-report.xml
        - name: e2e-log-name
          value: e2e-tests.log
        - name: cluster-provision-log-name
          value: kind-aws-provision.log
        - name: enable-test-results-analysis
          value: "true"
        - name: artifact-browser-url
          value: $(params.artifact-browser-url)
